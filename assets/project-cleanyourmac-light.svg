<svg xmlns="http://www.w3.org/2000/svg" width="548" height="196" viewBox="0 0 548 196" role="img" aria-labelledby="title desc">
  <title id="title">Open CleanYourMac on GitHub</title>
  <desc id="desc">A terminal-style project card that links to the CleanYourMac repository.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .meta { font-size: 11px; }
    .desc { font-size: 11px; }
    .chip { font-size: 9px; }
    .pulse { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .28; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>
  <g class="card card-0"><rect x="0" y="0" width="548" height="196" rx="14" fill="#FFFFFF" stroke="#AEB8C6"/><rect x="0" y="0" width="548" height="34" rx="14" fill="#ECEDE7"/><rect x="0" y="18" width="548" height="16" fill="#ECEDE7"/><line x1="0" y1="34" x2="548" y2="34" stroke="#AEB8C6"/><circle cx="20" cy="17" r="4" fill="#6737C7"/><circle cx="34" cy="17" r="4" fill="#006C8F"/><text x="52" y="21" class="mono meta" fill="#556078">Anthony-Pan/CleanYourMac</text><circle cx="529" cy="17" r="4" fill="#526B00" class="pulse"/><text x="20" y="70" class="mono" font-size="18" font-weight="700" fill="#101827">CleanYourMac</text><text x="20" y="91" class="mono desc" fill="#556078">An interactive macOS cleanup tool that measures before</text><text x="20" y="106" class="mono desc" fill="#556078">it removes.</text><rect x="20" y="125" width="50" height="20" rx="10" fill="#F0EBFF" stroke="#AEB8C6"/><text x="45" y="139" class="mono chip" fill="#6737C7" text-anchor="middle">Swift</text><rect x="77" y="125" width="50" height="20" rx="10" fill="#F0EBFF" stroke="#AEB8C6"/><text x="102" y="139" class="mono chip" fill="#6737C7" text-anchor="middle">macOS</text><rect x="134" y="125" width="96" height="20" rx="10" fill="#F0EBFF" stroke="#AEB8C6"/><text x="182" y="139" class="mono chip" fill="#6737C7" text-anchor="middle">Safety first</text><rect x="20" y="164" width="508" height="5" rx="2.5" fill="#AEB8C6"/><rect x="20" y="164" width="495" height="5" fill="#58D6FF"/><rect x="515" y="164" width="10" height="5" fill="#A361EB"/><rect x="525" y="164" width="3" height="5" fill="#C7F36B"/><text x="20" y="185" class="mono meta" fill="#556078">★ 1  ·  Swift · Shell  ·  refreshed 2026-07-20</text><animate attributeName="opacity" from="0" to="1" dur=".45s" begin="0.14s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" dur=".45s" begin="0.14s" fill="freeze"/></g>
